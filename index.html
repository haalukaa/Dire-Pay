<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100b"><title>Dire Pay</title>
<style>
:root{--bg:#060908;--s:#0f1612;--s2:#162019;--t:#f5f8f6;--m:#8b9991;--g:#58ef98;--l:#243029;--r:22px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#173322,#060908 35%);color:var(--t);font:14px Inter,system-ui,sans-serif}.app{width:min(100%,470px);min-height:100vh;margin:auto;background:#070b09;position:relative;padding-bottom:90px}.top{height:70px;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#070b09e8;backdrop-filter:blur(16px);z-index:5}.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:11px;background:var(--g);color:#04210f;display:grid;place-items:center;font-weight:900}.ava{width:37px;height:37px;border-radius:50%;border:1px solid var(--l);background:var(--s2);color:white}.page{padding:10px 20px 24px}.muted{color:var(--m)}.balance{font-size:45px;font-weight:850;letter-spacing:-2px;margin:8px 0}.balance small{font-size:14px;color:var(--m);letter-spacing:0}.pill{display:inline-block;font-size:10px;font-weight:800;color:#ffd47b;border:1px solid #5a4925;background:#2c2412;border-radius:99px;padding:6px 9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.btn{border:0;border-radius:17px;padding:15px 16px;font-weight:800;background:var(--g);color:#05170b}.btn.alt{background:var(--s2);color:white;border:1px solid var(--l)}.btn.full{width:100%}.card{background:linear-gradient(#121b16,#0d1310);border:1px solid var(--l);border-radius:var(--r);padding:17px;margin:13px 0}.card h3{margin:0 0 5px}.card p{margin:0;color:var(--m);line-height:1.5}.section{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 10px}.section h2{font-size:17px;margin:0}.link{border:0;background:none;color:var(--g);font-weight:800}.people{display:flex;gap:14px;overflow:auto}.person{border:0;background:none;color:white;text-align:center;padding:0}.bubble{width:53px;height:53px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--l);font-weight:800;margin-bottom:6px}.person span{font-size:11px;color:var(--m)}.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--l)}.row:last-child{border-bottom:0}.grow{flex:1;min-width:0}.grow strong,.grow span{display:block}.grow span{font-size:11px;color:var(--m);margin-top:3px}.amt{font-weight:800}.in{color:var(--g)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,470px);height:82px;background:#080c0aeF;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:max(8px,env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.nav button{border:0;background:none;color:var(--m);font-size:11px}.nav button.active{color:var(--g)}.back{width:38px;height:38px;border-radius:13px;border:1px solid var(--l);background:var(--s);color:white;margin-right:10px}.head{display:flex;align-items:center;margin-bottom:18px}.head h1{font-size:21px;margin:0}.label{display:block;color:var(--m);font-size:11px;font-weight:800;margin:17px 0 8px}.input{width:100%;padding:15px;border-radius:16px;border:1px solid var(--l);background:var(--s2);color:white;outline:0}.money{font-size:31px;font-weight:800;text-align:center}.note{font-size:11px;line-height:1.5;color:var(--m);border:1px solid var(--l);border-radius:15px;padding:12px;margin:13px 0}.success{text-align:center;padding:50px 0}.check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#05220f;font-size:31px;font-weight:900;margin:0 auto 18px}.qr{width:220px;height:220px;background:white;border-radius:28px;margin:22px auto;padding:19px;display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.q{background:white;border-radius:2px}.q.on{background:#07100b}.vcard{aspect-ratio:1.6;border-radius:27px;padding:22px;background:linear-gradient(145deg,#122019,#213b2c);border:1px solid #31483a;position:relative;overflow:hidden}.vcard:after{content:'';position:absolute;width:190px;height:190px;background:#58ef9820;border-radius:50%;right:-70px;top:-70px}.vnum{font-size:20px;letter-spacing:3px;margin-top:60px}.switch{width:44px;height:25px;border-radius:30px;background:#29332d;border:0;position:relative}.switch:after{content:'';position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:white}.switch.on{background:var(--g)}.switch.on:after{left:22px;background:#06210f}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);width:min(90%,420px);padding:13px;border-radius:14px;background:#ecfff3;color:#092211;font-weight:800;z-index:20}
</style>
</head><body><div id="root"></div>
<script>
const D={name:'Halle',phone:'+251 911 234 567',tag:'$halle',balance:10250,bio:true,alerts:true,locked:false,activity:[{type:'in',person:'Abel',amount:2500,note:'Lunch refund',date:'Today, 2:14 PM'},{type:'out',person:'Sara',amount:800,note:'Coffee & taxi',date:'Yesterday, 8:42 PM'},{type:'in',person:'Miki',amount:4000,note:'Transfer',date:'Aug 18'}]};let S=JSON.parse(localStorage.getItem('direpay')||'null')||D,R='home',X=null;const contacts=['Abel','Sara','Miki','Liya'];const root=document.querySelector('#root');const fmt=n=>new Intl.NumberFormat().format(n),save=()=>localStorage.setItem('direpay',JSON.stringify(S)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ini=s=>s.slice(0,2).toUpperCase();
function top(){return `<div class="top"><div class="brand"><div class="logo">D</div>Dire Pay</div><button class="ava" data-go="profile">HY</button></div>`}function nav(){return `<div class="nav">${[['home','⌂','Home'],['activity','↕','Activity'],['card','▣','Card'],['profile','◎','Profile']].map(a=>`<button data-go="${a[0]}" class="${R==a[0]?'active':''}"><div>${a[1]}</div>${a[2]}</button>`).join('')}</div>`}function head(t){return `<div class="head"><button class="back" data-go="home">←</button><h1>${t}</h1></div>`}function rows(limit){let a=limit?S.activity.slice(0,limit):S.activity;return a.map(x=>`<div class="row"><div class="bubble" style="width:40px;height:40px;margin:0">${ini(x.person)}</div><div class="grow"><strong>${x.type==='in'?'From':'To'} ${esc(x.person)}</strong><span>${esc(x.note)} · ${esc(x.date)}</span></div><div class="amt ${x.type==='in'?'in':''}">${x.type==='in'?'+':'−'}${fmt(x.amount)} ETB</div></div>`).join('')}
function home(){return `${top()}<main class="page"><span class="muted">Available balance</span><div class="balance">${fmt(S.balance)} <small>ETB</small></div><span class="pill">DEMO MONEY</span><div class="actions"><button class="btn" data-go="send">↑ Send</button><button class="btn alt" data-go="request">↓ Request</button></div><div class="section"><h2>Send again</h2></div><div class="people">${contacts.map(n=>`<button class="person" data-person="${n}"><div class="bubble">${ini(n)}</div><span>${n}</span></button>`).join('')}</div><div class="card" data-go="qr"><h3>Dire QR</h3><p>Let someone scan your code to pay you instantly.</p></div><div class="section"><h2>Recent activity</h2><button class="link" data-go="activity">See all</button></div><div class="card">${rows(3)}</div><div class="note">Pilot mode. These are simulated ETB balances and transactions; no real funds are held or moved.</div></main>${nav()}`}
function send(){return `${top()}<main class="page">${head('Send money')}<form id="send"><label class="label">Phone number or DireTag</label><input class="input" name="to" value="${esc(X?.person||'')}" placeholder="0911... or $diretag" required><label class="label">Amount</label><input class="input money" name="amount" type="number" min="1" placeholder="0 ETB" required><label class="label">Note</label><input class="input" name="note" placeholder="What’s this for?"><div class="note">Available: ${fmt(S.balance)} ETB · demo only</div><button class="btn full">Continue</button></form></main>`}
function confirm(){return `${top()}<main class="page">${head('Confirm payment')}<div class="card"><p>Sending to</p><h3 style="font-size:22px;margin-top:8px">${esc(X.to)}</h3></div><div class="success" style="padding:30px 0"><span class="muted">You’re sending</span><div class="balance">${fmt(X.amount)} <small>ETB</small></div><p class="muted">${esc(X.note)}</p></div><button class="btn full" id="pay">Send ${fmt(X.amount)} ETB</button></main>`}
function sent(){return `${top()}<main class="page"><div class="success"><div class="check">✓</div><h1>Payment sent</h1><p class="muted">${fmt(X.amount)} ETB was sent to ${esc(X.to)}.</p></div><button class="btn full" data-go="home">Done</button></main>`}
function request(){return `${top()}<main class="page">${head('Request money')}<form id="req"><label class="label">From</label><input class="input" name="to" placeholder="Phone number or DireTag" required><label class="label">Amount</label><input class="input money" name="amount" type="number" min="1" placeholder="0 ETB" required><label class="label">Note</label><input class="input" name="note" placeholder="What’s this for?"><button class="btn full" style="margin-top:18px">Send request</button></form></main>`}
function requested(){return `${top()}<main class="page"><div class="success"><div class="check">↙</div><h1>Request sent</h1><p class="muted">Requested ${fmt(X.amount)} ETB from ${esc(X.to)}.</p></div><button class="btn full" data-go="home">Done</button></main>`}
function activity(){return `${top()}<main class="page"><div class="section"><h2>Activity</h2></div><div class="card">${rows()}</div></main>${nav()}`}
function qr(){let bits=Array.from({length:81},(_,i)=>(i*17+11)%5!=0);return `${top()}<main class="page">${head('Receive with QR')}<div class="qr">${bits.map(x=>`<div class="q ${x?'on':''}"></div>`).join('')}</div><div style="text-align:center"><h2>${S.name}</h2><p class="muted">${S.tag} · ${S.phone}</p></div><div class="card"><h3>Scan to pay</h3><p>Production QR codes will use signed payment data. This one demonstrates the Dire Pay experience.</p></div></main>`}
function card(){return `${top()}<main class="page"><div class="section"><h2>Dire Card</h2><span class="pill">COMING LATER</span></div><div class="vcard"><b>DIRE PAY</b><div class="vnum">•••• •••• •••• 4821</div><div style="margin-top:23px">${S.name.toUpperCase()} &nbsp; 12/30</div></div><div class="card"><div class="row"><div class="grow"><strong>Lock card</strong><span>Temporarily stop transactions</span></div><button class="switch ${S.locked?'on':''}" data-toggle="locked"></button></div><div class="row"><div class="grow"><strong>Card controls</strong><span>Online, ATM & contactless</span></div>›</div></div><div class="note">Card issuance requires a licensed issuer/bank and card-network partnership.</div></main>${nav()}`}
function profile(){return `${top()}<main class="page"><div class="section"><h2>Profile & security</h2></div><div class="card"><div class="row"><div class="bubble" style="margin:0">HY</div><div class="grow"><strong>${S.name} ✓</strong><span>${S.phone} · ${S.tag}</span></div></div></div><div class="card"><div class="row"><div class="grow"><strong>Biometric security</strong><span>Face ID / fingerprint</span></div><button class="switch ${S.bio?'on':''}" data-toggle="bio"></button></div><div class="row"><div class="grow"><strong>Transaction alerts</strong><span>Instant payment notifications</span></div><button class="switch ${S.alerts?'on':''}" data-toggle="alerts"></button></div><div class="row"><div class="grow"><strong>Identity verification</strong><span>Verified for demo</span></div>✓</div></div><div class="card"><h3>Production security</h3><p>OTP/device binding, KYC, transaction limits, idempotent money APIs, fraud monitoring, admin RBAC, audit logs and a double-entry ledger.</p></div></main>${nav()}`}
function go(r,x=null){R=r;X=x;render();scrollTo(0,0)}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}function render(){let v={home,send,confirm,sent,request,requested,activity,qr,card,profile};root.innerHTML=`<div class="app">${(v[R]||home)()}</div>`;bind()}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>go('send',{person:b.dataset.person}));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{S[b.dataset.toggle]=!S[b.dataset.toggle];save();render()});let f=document.querySelector('#send');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),a=Number(d.get('amount'));if(a>S.balance)return toast('Not enough demo balance.');go('confirm',{to:d.get('to'),amount:a,note:d.get('note')})};let p=document.querySelector('#pay');if(p)p.onclick=()=>{let x={...X};S.balance-=x.amount;S.activity.unshift({type:'out',person:x.to,amount:x.amount,note:x.note||'Dire Pay',date:'Just now'});save();go('sent',x)};let q=document.querySelector('#req');if(q)q.onsubmit=e=>{e.preventDefault();let d=new FormData(q);go('requested',{to:d.get('to'),amount:Number(d.get('amount')),note:d.get('note')})}}render();
</script></body></html>
